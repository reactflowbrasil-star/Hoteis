name: Deploy Hoteis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoteis-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP credentials
        id: credentials
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [[ -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Configure the FTP_USERNAME and FTP_PASSWORD repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up PHP
        if: steps.credentials.outputs.configured == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Prepare Laravel cache directories
        if: steps.credentials.outputs.configured == 'true'
        run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views

      - name: Install PHP dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build frontend assets
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci && npm run build

      - name: Deploy to Hoteis
        if: steps.credentials.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: host141-200.viabrs.com.br
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          local-dir: ./
          security: strict
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.env
            **/.env.*
            **/database/travelin.sql
            **/documentation/**
            **/tests/**
